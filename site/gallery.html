        ul.useful-links {
            list-style: none;

            padding-left: 1em;
            background-image: url('images/link.png');
            background-repeat: no-repeat;
            background-position: left center;
            background-size: 10px 10px;
            margin-bottom: 10px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .row-span-2 {
            grid-row: span 2;
        }

        .col-span-2 {
            grid-column: span 2;
        }

        .gallery a:hover {
            transform: scale(1.1);
            transition: transform 0.3s ease;
        }
    </style>
